<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARVÉN Admin</title><style>body{font-family:system-ui;margin:0;background:#f6f4ef;color:#222}header{padding:18px 24px;background:#111;color:#fff;display:flex;justify-content:space-between;align-items:center}main{max-width:1200px;margin:24px auto;padding:0 16px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:#fff;border:1px solid #ddd;border-radius:12px;padding:16px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}button,input,select{padding:10px;border:1px solid #ccc;border-radius:8px}button{cursor:pointer}.danger{background:#8b1e1e;color:#fff}.ok{background:#e7f6e7}.hidden{display:none}table{width:100%;border-collapse:collapse;background:#fff}th,td{padding:9px;border-bottom:1px solid #eee;text-align:left;font-size:13px}.login{max-width:420px;margin:80px auto;background:#fff;padding:24px;border-radius:14px}.login input{width:100%;box-sizing:border-box;margin:7px 0}.stats{font-size:28px;font-weight:700}.muted{color:#777}</style></head><body><header><b>ARVÉN Creative — Admin</b><button id="logout" class="hidden">Logout</button></header><main><section id="login" class="login"><h2>Admin Login</h2><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button onclick="login()">Sign in</button><p id="loginMsg" class="muted"></p></section><section id="app" class="hidden"><div class="grid"><div class="card"><div class="muted">Orders</div><div id="ordersCount" class="stats">—</div></div><div class="card"><div class="muted">Products</div><div id="productsCount" class="stats">—</div></div><div class="card"><div class="muted">Available inventory</div><div id="inventoryCount" class="stats">—</div></div><div class="card"><div class="muted">Verified payments</div><div id="paymentsCount" class="stats">—</div></div></div><div class="toolbar"><select id="status"><option value="">All statuses</option><option>PENDING_PAYMENT</option><option>PAYMENT_VERIFIED</option><option>PROCESSING</option><option>DELIVERED</option><option>COMPLETED</option><option>FAILED</option></select><button onclick="loadOrders()">Refresh orders</button><button onclick="loadProducts()">Products & inventory</button></div><div id="content"></div></section></main><script>
async function api(url,opt={}){const r=await fetch(url,{headers:{'content-type':'application/json',...(opt.headers||{})},...opt});const d=await r.json();if(!r.ok)throw new Error(d.error||'Request failed');return d}
async function login(){try{await api('/api/admin/login',{method:'POST',body:JSON.stringify({email:email.value,password:password.value})});show();}catch(e){loginMsg.textContent=e.message}}
async function boot(){try{await api('/api/admin/me');show()}catch{}}
function show(){document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');logout.classList.remove('hidden');loadDashboard();loadOrders()}
logout.onclick=async()=>{await api('/api/admin/logout',{method:'POST'});location.reload()}
async function loadDashboard(){const d=await api('/api/admin/dashboard');ordersCount.textContent=d.orders;productsCount.textContent=d.products;inventoryCount.textContent=d.availableInventory;paymentsCount.textContent=d.verifiedPayments}
async function loadOrders(){const q=status.value?('?status='+encodeURIComponent(status.value)):'';const d=await api('/api/admin/orders'+q);content.innerHTML='<h2>Orders</h2><table><thead><tr><th>ID</th><th>Customer</th><th>Total</th><th>Payment</th><th>Status</th><th>Created</th><th>Action</th></tr></thead><tbody>'+d.orders.map(o=>`<tr><td>${o.id}</td><td>${o.name}<br><span class="muted">${o.email}</span></td><td>$${Number(o.total).toFixed(2)}</td><td>${o.paymentMethod}<br>${o.txid||''}</td><td>${o.status}</td><td>${new Date(o.createdAt).toLocaleString()}</td><td><button onclick="fulfill('${o.id}')">Fulfill</button> <button onclick="verify('${o.id}','${o.paymentMethod}','${o.txid||''}')">Verify</button></td></tr>`).join('')+'</tbody></table>'}
async function fulfill(id){try{await api('/api/admin/orders/'+id+'/fulfill',{method:'POST'});loadDashboard();loadOrders()}catch(e){alert(e.message)}}
async function verify(id,method,txid){if(!txid){alert('No transaction ID stored');return}try{await api('/api/payments/verify',{method:'POST',body:JSON.stringify({orderId:id,method,txid,providerOrderId:txid})});loadDashboard();loadOrders()}catch(e){alert(e.message)}}
async function loadProducts(){const d=await api('/api/admin/products');content.innerHTML='<h2>Products & Inventory</h2><table><thead><tr><th>ID</th><th>Product</th><th>Price</th><th>Available</th><th>Action</th></tr></thead><tbody>'+d.products.map(p=>{const c=p.inventory.filter(i=>i.status==='AVAILABLE').length;return `<tr><td>${p.id}</td><td>${p.title}</td><td>$${Number(p.price).toFixed(2)}</td><td>${c}</td><td><button onclick="addStock(${p.id})">Add stock</button></td></tr>`}).join('')+'</tbody></table>'}
async function addStock(id){const raw=prompt('Enter one inventory code per line');if(!raw)return;const values=raw.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);try{await api('/api/admin/inventory',{method:'POST',body:JSON.stringify({productId:id,values})});alert('Stock added');loadProducts();loadDashboard()}catch(e){alert(e.message)}}
boot();
</script></body></html>
